services:
  nginx:
    container_name: nginx
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    restart: on-failure
    networks:
      - inception
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - wordpress
    secrets:
      - ssl_key
      - ssl_crt
    volumes:
      - wordpress_data:/var/www/html

  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception


  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - .env
    networks:
      - inception
    expose:
      - "9000:9000"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb

secrets:
  ssl_key:
    file: "../.SECRETS/private_key.key"
  ssl_crt:
    file: "../.SECRETS/certificate.crt"

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: 'none'
      device: '/home/rperrot/data/mariadb'
      o: 'bind'
  wordpress_data:
    driver: local
    driver_opts:
      type: 'none'
      device: '/home/rperrot/data/wordpress'
      o: 'bind'

networks:
  inception:
    name: inception